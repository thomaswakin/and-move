<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>And Move</title>
<style>
  :root{--paper:#FAF8F4;--ink:#14181A;--dim:#6E6961;--olive:#6B8248;--slate:#223B47;--hair:#EDE8DE;}
  @media (prefers-color-scheme: dark){:root{--paper:#15171A;--ink:#F2EFE9;--dim:#A49E95;--olive:#9DB07C;--slate:#AFC6D2;--hair:#2A2E33;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:64px 20px 80px}
  h1{font-size:40px;letter-spacing:-.5px;margin:0 0 6px}
  .tag{color:var(--dim);font-size:18px;margin:0 0 40px}
  .links{display:flex;gap:14px;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;color:var(--paper);background:var(--slate);padding:12px 20px;border-radius:12px;font-weight:600}
  a.btn.alt{background:transparent;color:var(--slate);border:1px solid var(--hair)}
  footer{margin-top:56px;color:var(--dim);font-size:14px;border-top:1px solid var(--hair);padding-top:20px}
  a{color:var(--olive)}
</style>
</head>
<body>
  <div class="wrap">
    <h1>And Move</h1>
    <p class="tag">A deliberately simple movement tracker. One box a day — check it if you moved, in any way. Walk, gym, pilates, dance, or a deliberate rest day. Your streak, without the guilt.</p>
    <div class="links">
      <a class="btn" href="support.html">Support</a>
      <a class="btn alt" href="privacy.html">Privacy Policy</a>
    </div>
    <footer>Made by The Simple Group.</footer>
  </div>
</body>
</html>
